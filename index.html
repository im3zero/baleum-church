    <style>
        :root {
            --bg: #F8F5EF;
            --surface: #FFFFFF;
            --gold: #C9A84C;
            --gold-light: #E8D5A0;
            --text-primary: #1B2A4A;
            --text-secondary: #6B7280;
            --border: rgba(27, 42, 74, 0.10);
            --shadow: 0 2px 16px rgba(27, 42, 74, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0F1A2E;
                --surface: #1A2840;
                --gold: #C9A84C;
                --gold-light: rgba(201, 168, 76, 0.15);
                --text-primary: #EDE8DF;
                --text-secondary: #9CA3AF;
                --border: rgba(232, 213, 160, 0.12);
                --shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
            }
        }

        :root[data-theme="dark"] {
            --bg: #0F1A2E;
            --surface: #1A2840;
            --gold: #C9A84C;
            --gold-light: rgba(201, 168, 76, 0.15);
            --text-primary: #EDE8DF;
            --text-secondary: #9CA3AF;
            --border: rgba(232, 213, 160, 0.12);
            --shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 100%;
            display: flex;
            justify-content: center;
            padding-inline: 16px;
            padding-block: 48px 64px;
        }

        .page {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding-block: 0 40px;
            text-align: center;
        }

        .emblem svg {
            width: 80px;
            height: 80px;
        }

        .church-name {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 28px;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        h2 {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .church-sub {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
            line-height: 1.5;
        }

        .divider {
            width: 40px;
            height: 2px;
            background: var(--gold);
            border-radius: 2px;
        }

        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-primary);
            box-shadow: var(--shadow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--gold);
            border-radius: 0 2px 2px 0;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(27, 42, 74, 0.12);
        }

        .link-card:hover::before {
            opacity: 1;
        }

        .link-card:active {
            transform: translateY(0);
        }

        .icon-wrap {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--gold-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-wrap svg {
            width: 22px;
            height: 22px;
            fill: var(--gold);
        }

        .link-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .link-label {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .link-desc {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .arrow {
            color: var(--text-secondary);
            opacity: 0.5;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        /* 인스타 드롭다운 */
        .insta-wrap {
            display: flex;
            flex-direction: column;
        }

        .insta-toggle {
            cursor: pointer;
            user-select: none;
            transition: border-radius 0.2s ease, transform 0.15s ease, box-shadow 0.15s ease;
        }

        .insta-toggle.open {
            border-radius: 16px 16px 0 0;
        }

        .insta-toggle.open .arrow {
            transform: rotate(90deg);
        }

        .insta-dropdown {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.25s ease;
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 16px 16px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .insta-dropdown.open {
            max-height: 300px;
        }

        .insta-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            border-top: 1px solid var(--border);
            transition: background 0.1s ease;
        }

        .insta-item:hover {
            background: var(--gold-light);
        }

        .insta-item:last-child {
            border-radius: 0 0 16px 16px;
        }

        .insta-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
            flex-shrink: 0;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            opacity: 0.6;
            letter-spacing: 0.02em;
            line-height: 1.8;
        }
    </style>
</head>

<script>
    function toggleInsta(btn) {
        const dropdown = btn.nextElementSibling;
        const isOpen = btn.classList.contains('open');
        btn.classList.toggle('open', !isOpen);
        dropdown.classList.toggle('open', !isOpen);
    }
